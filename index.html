<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Planos de Estudo · Curso Loghus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Source+Sans+3:wght@400;600&display=swap">
<style>
:root{--bg:#f4f6f8;--surface:#fcfcfd;--ink:#0e1420;--ink-2:#4d5566;--rule:#dfe4eb;--navy:#173a63;--accent:#2a78d6}
@media (prefers-color-scheme:dark){:root{--bg:#0d121b;--surface:#151c28;--ink:#eef1f5;--ink-2:#a7b0c0;--rule:#263043;--navy:#86b6ef;--accent:#86b6ef}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:16px/1.55 "Source Sans 3",system-ui,sans-serif;padding:24px 16px}
main{max-width:520px;width:100%;background:var(--surface);border:1px solid var(--rule);border-radius:14px;padding:40px 32px;text-align:center}
.tag{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:600}
h1{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:clamp(28px,6vw,38px);line-height:1.1;margin:10px 0 14px;color:var(--navy)}
p{color:var(--ink-2);margin:0 0 10px}
small{display:block;margin-top:24px;color:var(--ink-2);font-size:13px;border-top:1px solid var(--rule);padding-top:16px}
</style>
</head>
<body>
<main>
  <div class="tag">Curso Loghus · Barra</div>
  <h1>Planos de Estudo Individuais</h1>
  <p>Cada aluno recebe o link direto do seu plano, gerado a partir dos simulados ENEM.</p>
  <p>Se você é aluno e não recebeu o seu, fale com a coordenação.</p>
  <small>Uso interno · páginas não indexadas por buscadores</small>
</main>
</body>
</html>
